<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1500" height="945" viewBox="0 0 1500 945">
  <defs>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1A1A1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A0A0A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#DC2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B91C1C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="vanBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E5E7EB;stop-opacity:1" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="1500" height="945" fill="url(#darkBg)"/>

  <!-- Decorative red glow circles -->
  <circle cx="1400" cy="100" r="200" fill="#DC2626" opacity="0.08"/>
  <circle cx="100" cy="880" r="180" fill="#DC2626" opacity="0.06"/>

  <!-- Top red accent bar -->
  <rect x="0" y="0" width="1500" height="10" fill="url(#redBar)"/>

  <!-- === LEFT SIDE: VAN PHOTO === -->
  <image href="van.png" x="50" y="200" width="680" height="500" preserveAspectRatio="xMidYMid meet"/>

  <!-- === RIGHT SIDE: INFO PANEL === -->

  <!-- Company name -->
  <g transform="translate(780, 175)">
    <text x="0" y="0" font-family="Arial Black, sans-serif" font-size="72" font-weight="900" fill="#DC2626" letter-spacing="2">REDSPEED</text>
    <text x="0" y="70" font-family="Arial Black, sans-serif" font-size="56" font-weight="900" fill="#FFFFFF" letter-spacing="5">RIDER LTD</text>
    <line x1="0" y1="95" x2="300" y2="95" stroke="#DC2626" stroke-width="3"/>
    <text x="0" y="130" font-family="Arial, sans-serif" font-size="22" fill="#CCCCCC" letter-spacing="4">TRANSPORT &amp; REMOVALS</text>
  </g>

  <!-- Tagline -->
  <g transform="translate(780, 360)">
    <text x="0" y="0" font-family="Arial Black, sans-serif" font-size="32" font-weight="900" fill="white">Fast · Reliable · Affordable</text>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="18" fill="#999999">Man with a Van · Home &amp; Office Removals</text>
    <text x="0" y="60" font-family="Arial, sans-serif" font-size="18" fill="#999999">Furniture Delivery · Storage Moves · Pallets</text>
  </g>

  <!-- Divider -->
  <line x1="780" y1="465" x2="1430" y2="465" stroke="#333333" stroke-width="1"/>

  <!-- Phone numbers -->
  <g transform="translate(780, 520)">
    <!-- Number 1 - Main -->
    <g transform="translate(0, 0)">
      <circle cx="30" cy="15" r="30" fill="url(#redBar)"/>
      <text x="30" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="white">📞</text>
      <text x="85" y="5" font-family="Arial, sans-serif" font-size="14" fill="#999999" letter-spacing="2">CALL OR WHATSAPP</text>
      <text x="85" y="40" font-family="Arial Black, sans-serif" font-size="38" font-weight="900" fill="white">07466 025934</text>
    </g>
  </g>

  <g transform="translate(780, 615)">
    <!-- Number 2 - Alternative -->
    <g transform="translate(0, 0)">
      <circle cx="30" cy="15" r="30" fill="#25D366"/>
      <text x="30" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="white">💬</text>
      <text x="85" y="5" font-family="Arial, sans-serif" font-size="14" fill="#999999" letter-spacing="2">ALTERNATIVE NUMBER</text>
      <text x="85" y="40" font-family="Arial Black, sans-serif" font-size="38" font-weight="900" fill="white">07424 714686</text>
    </g>
  </g>

  <!-- Website -->
  <g transform="translate(780, 740)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" fill="#999999" letter-spacing="2">VISIT OUR WEBSITE</text>
    <text x="0" y="45" font-family="Arial Black, sans-serif" font-size="42" font-weight="900" fill="#DC2626" letter-spacing="1">redspeedrider.co.uk</text>
  </g>

  <!-- Location (plain text, cleaner) -->
  <g transform="translate(780, 830)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" fill="#999999" letter-spacing="2">LOCATION</text>
    <text x="0" y="30" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="white" letter-spacing="1">📍 Abingdon · Oxfordshire · UK</text>
  </g>

  <!-- Bottom red accent -->
  <rect x="0" y="935" width="1500" height="10" fill="url(#redBar)"/>
</svg>
