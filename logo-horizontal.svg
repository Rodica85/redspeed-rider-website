<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="500" viewBox="0 0 1600 500">
  <defs>
    <linearGradient id="bgH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A"/>
      <stop offset="100%" style="stop-color:#2A0A0A"/>
    </linearGradient>
    <linearGradient id="redH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EF4444"/>
      <stop offset="100%" style="stop-color:#B91C1C"/>
    </linearGradient>
    <filter id="vanShadowH" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="500" fill="url(#bgH)"/>
  <rect x="0" y="0" width="1600" height="10" fill="url(#redH)"/>

  <!-- Decorative glow -->
  <circle cx="1500" cy="60" r="180" fill="#DC2626" opacity="0.10"/>
  <circle cx="100" cy="440" r="140" fill="#DC2626" opacity="0.08"/>

  <!-- Speed lines behind van -->
  <g opacity="0.5">
    <line x1="20" y1="220" x2="120" y2="220" stroke="#DC2626" stroke-width="8" stroke-linecap="round"/>
    <line x1="10" y1="260" x2="100" y2="260" stroke="#DC2626" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <line x1="30" y1="300" x2="90" y2="300" stroke="#DC2626" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- VAN PHOTO (left side) -->
  <image href="van-transparent.png" x="60" y="130" width="560" height="282" preserveAspectRatio="xMidYMid meet" filter="url(#vanShadowH)"/>

  <!-- BRAND NAME (right) -->
  <g transform="translate(680, 140)">
    <text x="0" y="90" font-family="Arial Black, Helvetica, sans-serif" font-size="108" font-weight="900" fill="#DC2626" letter-spacing="4">REDSPEED</text>
    <text x="0" y="210" font-family="Arial Black, Helvetica, sans-serif" font-size="96" font-weight="900" fill="#FFFFFF" letter-spacing="18">RIDER LTD</text>
    <line x1="0" y1="240" x2="540" y2="240" stroke="url(#redH)" stroke-width="5" stroke-linecap="round"/>
    <text x="0" y="290" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#E5E5E5" letter-spacing="8">TRANSPORT &amp; REMOVALS</text>
  </g>
</svg>
