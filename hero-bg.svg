<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111111"/>
      <stop offset="50%" style="stop-color:#1A1A1A"/>
      <stop offset="100%" style="stop-color:#B91C1C"/>
    </linearGradient>
    <!-- Road gradient -->
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#333333"/>
      <stop offset="100%" style="stop-color:#222222"/>
    </linearGradient>
    <!-- Van body gradient -->
    <linearGradient id="vanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8E8E8"/>
    </linearGradient>
    <!-- Red accent gradient -->
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#DC2626"/>
      <stop offset="100%" style="stop-color:#EF4444"/>
    </linearGradient>
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="4" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="boxShadow">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Decorative red circles -->
  <circle cx="1600" cy="200" r="300" fill="#DC2626" opacity="0.08"/>
  <circle cx="200" cy="800" r="200" fill="#DC2626" opacity="0.06"/>
  <circle cx="1000" cy="100" r="150" fill="#25D366" opacity="0.04"/>

  <!-- City skyline silhouette (far background) -->
  <g opacity="0.12" fill="#FFFFFF">
    <!-- Buildings -->
    <rect x="100" y="450" width="60" height="250" rx="2"/>
    <rect x="170" y="500" width="45" height="200" rx="2"/>
    <rect x="225" y="420" width="70" height="280" rx="2"/>
    <rect x="305" y="480" width="50" height="220" rx="2"/>
    <rect x="365" y="520" width="40" height="180" rx="2"/>
    <rect x="420" y="460" width="55" height="240" rx="2"/>
    <rect x="490" y="510" width="35" height="190" rx="2"/>

    <rect x="1350" y="470" width="55" height="230" rx="2"/>
    <rect x="1415" y="430" width="65" height="270" rx="2"/>
    <rect x="1490" y="490" width="45" height="210" rx="2"/>
    <rect x="1545" y="450" width="60" height="250" rx="2"/>
    <rect x="1615" y="510" width="40" height="190" rx="2"/>
    <rect x="1665" y="460" width="70" height="240" rx="2"/>
    <rect x="1745" y="500" width="50" height="200" rx="2"/>
  </g>

  <!-- Road -->
  <rect x="0" y="700" width="1920" height="380" fill="url(#roadGrad)"/>
  <!-- Road line markings -->
  <g fill="#666666" opacity="0.6">
    <rect x="50" y="780" width="120" height="4" rx="2"/>
    <rect x="250" y="780" width="120" height="4" rx="2"/>
    <rect x="450" y="780" width="120" height="4" rx="2"/>
    <rect x="650" y="780" width="120" height="4" rx="2"/>
    <rect x="850" y="780" width="120" height="4" rx="2"/>
    <rect x="1050" y="780" width="120" height="4" rx="2"/>
    <rect x="1250" y="780" width="120" height="4" rx="2"/>
    <rect x="1450" y="780" width="120" height="4" rx="2"/>
    <rect x="1650" y="780" width="120" height="4" rx="2"/>
    <rect x="1850" y="780" width="70" height="4" rx="2"/>
  </g>

  <!-- ====== THE VAN ====== -->
  <g filter="url(#softShadow)" transform="translate(650, 380)">
    <!-- Van cargo area (back) -->
    <rect x="0" y="80" width="350" height="250" rx="8" fill="url(#vanGrad)"/>
    <!-- Van cargo area side panel lines -->
    <line x1="20" y1="100" x2="20" y2="310" stroke="#CCCCCC" stroke-width="1.5"/>
    <line x1="175" y1="100" x2="175" y2="310" stroke="#CCCCCC" stroke-width="1.5"/>
    <line x1="330" y1="100" x2="330" y2="310" stroke="#CCCCCC" stroke-width="1.5"/>

    <!-- Red stripe on van -->
    <rect x="0" y="280" width="350" height="50" rx="0" fill="url(#redAccent)"/>
    <rect x="350" y="280" width="200" height="50" rx="0" fill="url(#redAccent)"/>

    <!-- REDSPEED text on van -->
    <text x="175" y="265" font-family="Arial, sans-serif" font-weight="900" font-size="38" fill="#DC2626" text-anchor="middle" letter-spacing="3">REDSPEED</text>
    <text x="175" y="320" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="#FFFFFF" text-anchor="middle" letter-spacing="5">RIDER</text>

    <!-- Van cabin -->
    <rect x="350" y="130" width="200" height="200" rx="8" fill="url(#vanGrad)"/>
    <!-- Windshield -->
    <rect x="380" y="150" width="150" height="100" rx="6" fill="#1a3a4a" opacity="0.8"/>
    <!-- Windshield reflection -->
    <rect x="385" y="155" width="60" height="90" rx="4" fill="#FFFFFF" opacity="0.1"/>

    <!-- Van roof -->
    <path d="M350,130 L350,90 Q350,70 370,70 L530,70 Q550,70 550,90 L550,130" fill="#E8E8E8" stroke="#CCCCCC" stroke-width="1"/>

    <!-- Side mirror -->
    <rect x="545" y="170" width="30" height="20" rx="4" fill="#666666"/>
    <rect x="548" y="173" width="24" height="14" rx="3" fill="#1a3a4a"/>

    <!-- Headlight -->
    <rect x="545" y="260" width="25" height="35" rx="6" fill="#FFD700" opacity="0.9" filter="url(#glow)"/>

    <!-- Green accent line -->
    <rect x="0" y="74" width="550" height="6" rx="3" fill="#25D366"/>

    <!-- Door handle -->
    <rect x="460" y="220" width="25" height="6" rx="3" fill="#999999"/>

    <!-- Open back doors (one open) -->
    <rect x="-30" y="85" width="30" height="245" rx="4" fill="#E0E0E0" transform="rotate(-15, -30, 85)"/>
    <rect x="-28" y="90" width="26" height="60" rx="3" fill="#C0C0C0" opacity="0.5"/>

    <!-- Wheels -->
    <g>
      <!-- Back wheel -->
      <circle cx="100" cy="340" r="45" fill="#222222"/>
      <circle cx="100" cy="340" r="38" fill="#333333"/>
      <circle cx="100" cy="340" r="20" fill="#555555"/>
      <circle cx="100" cy="340" r="10" fill="#888888"/>
      <!-- Wheel spokes -->
      <line x1="100" y1="302" x2="100" y2="378" stroke="#444444" stroke-width="3"/>
      <line x1="62" y1="340" x2="138" y2="340" stroke="#444444" stroke-width="3"/>

      <!-- Front wheel -->
      <circle cx="450" cy="340" r="45" fill="#222222"/>
      <circle cx="450" cy="340" r="38" fill="#333333"/>
      <circle cx="450" cy="340" r="20" fill="#555555"/>
      <circle cx="450" cy="340" r="10" fill="#888888"/>
      <line x1="450" y1="302" x2="450" y2="378" stroke="#444444" stroke-width="3"/>
      <line x1="412" y1="340" x2="488" y2="340" stroke="#444444" stroke-width="3"/>
    </g>

    <!-- Bumper -->
    <rect x="540" y="315" width="20" height="30" rx="4" fill="#666666"/>

    <!-- License plate area -->
    <rect x="450" y="300" width="80" height="20" rx="3" fill="#FFFFFF"/>
    <text x="490" y="315" font-family="Arial, sans-serif" font-weight="700" font-size="10" fill="#111111" text-anchor="middle">RS 24 RED</text>
  </g>

  <!-- ====== PERSON LOADING BOXES ====== -->
  <g transform="translate(560, 460)">
    <!-- Person body -->
    <!-- Head -->
    <circle cx="50" cy="30" r="25" fill="#D4956A"/>
    <!-- Hair -->
    <path d="M28,20 Q30,0 50,5 Q70,0 72,20 Q75,15 72,25 L70,18 Q65,10 50,12 Q35,10 30,18 L28,25 Q25,15 28,20Z" fill="#333333"/>
    <!-- Cap -->
    <path d="M25,22 Q27,8 50,10 Q73,8 75,22" fill="#DC2626" stroke="#B91C1C" stroke-width="1"/>
    <rect x="20" y="20" width="60" height="5" rx="2" fill="#DC2626"/>

    <!-- Neck -->
    <rect x="42" y="53" width="16" height="12" fill="#D4956A"/>

    <!-- Body / T-shirt (green work shirt) -->
    <path d="M20,65 L80,65 L85,160 L15,160Z" fill="#25D366"/>
    <!-- Shirt collar -->
    <path d="M38,65 L50,80 L62,65" fill="#1FAD54" stroke="#1FAD54" stroke-width="1"/>
    <!-- Company logo on shirt -->
    <text x="50" y="120" font-family="Arial, sans-serif" font-weight="900" font-size="10" fill="#FFFFFF" text-anchor="middle">RS</text>

    <!-- Arms carrying box -->
    <!-- Right arm (holding box) -->
    <path d="M80,75 Q110,90 120,130 L115,135 Q105,95 78,82Z" fill="#D4956A"/>
    <!-- Left arm (under box) -->
    <path d="M20,75 Q-10,90 -15,130 L-10,135 Q-5,95 22,82Z" fill="#D4956A"/>

    <!-- Legs -->
    <!-- Right leg -->
    <path d="M55,155 L65,260 L80,262 L75,260 L62,160Z" fill="#333333"/>
    <!-- Left leg (stepping) -->
    <path d="M35,155 L25,260 L10,262 L15,260 L38,160Z" fill="#333333"/>

    <!-- Boots -->
    <rect x="8" y="255" width="28" height="12" rx="4" fill="#222222"/>
    <rect x="60" y="255" width="28" height="12" rx="4" fill="#222222"/>

    <!-- Work gloves -->
    <ellipse cx="-12" cy="132" rx="10" ry="8" fill="#FFD700"/>
    <ellipse cx="118" cy="132" rx="10" ry="8" fill="#FFD700"/>
  </g>

  <!-- ====== BOXES ====== -->
  <!-- Box being carried -->
  <g transform="translate(520, 560)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="80" height="60" rx="4" fill="#C4873B"/>
    <rect x="0" y="0" width="80" height="60" rx="4" fill="#D4963B" opacity="0.7"/>
    <!-- Box tape -->
    <rect x="35" y="0" width="10" height="60" fill="#C4873B" opacity="0.6"/>
    <rect x="0" y="25" width="80" height="10" fill="#C4873B" opacity="0.6"/>
    <!-- Fragile symbol -->
    <text x="40" y="20" font-family="Arial, sans-serif" font-size="10" fill="#8B6914" text-anchor="middle">FRAGILE</text>
  </g>

  <!-- Stack of boxes near van (on ground) -->
  <!-- Box 1 (bottom) -->
  <g transform="translate(680, 680)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="90" height="70" rx="4" fill="#C4873B"/>
    <rect x="40" y="0" width="10" height="70" fill="#A87030" opacity="0.5"/>
    <rect x="0" y="30" width="90" height="10" fill="#A87030" opacity="0.5"/>
    <text x="45" y="25" font-family="Arial, sans-serif" font-size="9" fill="#8B6914" text-anchor="middle">BOOKS</text>
  </g>
  <!-- Box 2 (on top) -->
  <g transform="translate(690, 620)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="70" height="55" rx="4" fill="#D4A063"/>
    <rect x="30" y="0" width="10" height="55" fill="#B8873B" opacity="0.5"/>
    <rect x="0" y="25" width="70" height="8" fill="#B8873B" opacity="0.5"/>
  </g>
  <!-- Box 3 (small, next to stack) -->
  <g transform="translate(780, 710)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="55" height="40" rx="3" fill="#E0B878"/>
    <rect x="24" y="0" width="8" height="40" fill="#C4A060" opacity="0.5"/>
  </g>

  <!-- Boxes already inside van (visible through open door) -->
  <g transform="translate(660, 470)" opacity="0.7">
    <rect x="0" y="0" width="60" height="50" rx="3" fill="#B87830"/>
    <rect x="65" y="10" width="55" height="40" rx="3" fill="#C48838"/>
    <rect x="10" y="-45" width="50" height="42" rx="3" fill="#A06828"/>
  </g>

  <!-- ====== DECORATIVE ELEMENTS ====== -->
  <!-- Speed lines behind van -->
  <g opacity="0.15" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
    <line x1="300" y1="550" x2="550" y2="550"/>
    <line x1="250" y1="580" x2="520" y2="580"/>
    <line x1="350" y1="610" x2="540" y2="610"/>
    <line x1="280" y1="640" x2="500" y2="640"/>
    <line x1="320" y1="670" x2="530" y2="670"/>
  </g>

  <!-- Green accent dots -->
  <circle cx="400" cy="500" r="4" fill="#25D366" opacity="0.3"/>
  <circle cx="450" cy="550" r="3" fill="#25D366" opacity="0.25"/>
  <circle cx="380" cy="600" r="5" fill="#25D366" opacity="0.2"/>
  <circle cx="1500" cy="400" r="4" fill="#25D366" opacity="0.3"/>
  <circle cx="1550" cy="450" r="3" fill="#25D366" opacity="0.25"/>

  <!-- Red accent particles -->
  <circle cx="1400" cy="300" r="6" fill="#DC2626" opacity="0.15"/>
  <circle cx="1450" cy="350" r="4" fill="#DC2626" opacity="0.2"/>
  <circle cx="300" cy="400" r="5" fill="#DC2626" opacity="0.15"/>

  <!-- Ground shadow under van -->
  <ellipse cx="900" cy="740" rx="300" ry="15" fill="#000000" opacity="0.3"/>

  <!-- Arrow / checkmark accent -->
  <g transform="translate(1400, 550)" opacity="0.15">
    <path d="M0,40 L20,60 L60,0" stroke="#25D366" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
